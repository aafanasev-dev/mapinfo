<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Map</title>
  <link rel="stylesheet" href="style.css">
  <link rel="help" href="/help">
</head>
<body>
  <svg id="map" aria-label="World map"></svg>

  <div id="actions">
    <button id="share-btn" class="btn round" title="Copy link" aria-label="Copy link">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <button id="edit-btn" class="btn round primary" title="Edit" aria-label="Edit">
      <svg class="icon-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
      <svg class="icon-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
    <a id="help-btn" class="btn round" href="/help" target="_blank" rel="noopener" title="Help" aria-label="Help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5a3.5 3.5 0 1 1 5.2 3.06c-.98.55-1.7 1.37-1.7 2.44v.5"/><path d="M12 18.5v.01"/></svg>
    </a>
  </div>

  <aside id="panel" hidden>
    <h2>Edit map</h2>
    <p class="hint">Click a country to enter a value.</p>

    <label>Units
      <input id="units" type="text" list="unit-presets" placeholder="e.g. %, $, people" maxlength="20">
      <datalist id="unit-presets">
        <option value="%"><option value="$"><option value="€"><option value="people">
        <option value="km²"><option value="t"><option value="°C">
      </datalist>
    </label>

    <div class="colors">
      <label>Low<input id="color-a" type="color"></label>
      <label>High<input id="color-b" type="color"></label>
      <label>No data<input id="color-n" type="color"></label>
    </div>
    <div id="panel-gradient" class="gradient-bar"></div>

    <div class="row">
      <button id="clear-btn" class="btn danger">Clear all data</button>
    </div>
    <button id="reset-colors-btn" class="btn link">Reset colors</button>
  </aside>

  <div id="popup" hidden>
    <div id="popup-name"></div>
    <form id="popup-form">
      <input id="popup-input" type="text" inputmode="decimal" autocomplete="off" placeholder="No data">
      <span id="popup-unit"></span>
      <div class="row">
        <button type="submit" class="btn primary">Save</button>
        <button type="button" id="popup-remove" class="btn">Remove</button>
      </div>
    </form>
  </div>

  <div id="zoom-controls">
    <button id="zoom-in" class="btn" title="Zoom in (+)" aria-label="Zoom in">+</button>
    <button id="zoom-out" class="btn" title="Zoom out (−)" aria-label="Zoom out">−</button>
    <button id="zoom-reset" class="btn" title="Reset view (0)" aria-label="Reset view">⟲</button>
  </div>

  <div id="tooltip" hidden></div>

  <div id="legend" hidden>
    <div class="gradient-bar" id="legend-bar"></div>
    <div class="legend-scale"><span id="legend-min"></span><span id="legend-max"></span></div>
    <div class="legend-nodata"><i id="legend-nodata-swatch"></i>No data</div>
  </div>

  <div id="overflow" hidden><ul id="overflow-list"></ul></div>

  <div id="toast" hidden></div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
