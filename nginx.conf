server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /help {
        try_files /help.html =404;
    }

    location /vendor/ {
        expires 30d;
    }
}
